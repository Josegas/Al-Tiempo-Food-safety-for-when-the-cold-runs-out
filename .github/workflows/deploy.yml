name: Deploy

# Continuous deployment of AlTiempoApp. Authenticates to AWS with OIDC (no stored keys):
# GitHub proves "this is main of this repo" and AWS lets it assume al-tiempo-github-deploy.
on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "rules/**"
      - "fixtures/**"
      - "web/**"
      - "infra/**"
      - "main.py"
      - "requirements.txt"
      - "scripts/package_agent.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for AWS
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # No `environment:` on purpose: it would change the OIDC subject claim and the AWS role
    # trusts exactly repo:<owner>/<repo>:ref:refs/heads/main.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            infra/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -r requirements-dev.txt -r infra/requirements.txt
      - name: Gate - tests and verified rules
        run: |
          python -m pytest -q
          python scripts/check_rules.py --strict
      - name: Package agent (ARM64 zip, no Docker)
        run: python scripts/package_agent.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: CDK deploy
        working-directory: infra
        env:
          CDK_DISABLE_CLI_TELEMETRY: "true"
        run: npx -y aws-cdk@2.1147.0 deploy AlTiempoApp --require-approval never --outputs-file ../build/outputs.json
      - name: Smoke test (live demo answers 13:00 from the rules)
        run: python scripts/smoke_test.py --no-reminder
      - name: Summary
        if: always()
        run: |
          if [ -f build/outputs.json ]; then
            python -c "import json;o=json.load(open('build/outputs.json'))['AlTiempoApp'];print('### Deployed: ' + o['SiteUrl'])" >> "$GITHUB_STEP_SUMMARY"
          fi
