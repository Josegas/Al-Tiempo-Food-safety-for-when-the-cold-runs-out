name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint + format)
        run: |
          ruff check . --output-format=github
          ruff format --check .
      - name: Rules policy check (sources present; unverified = warning)
        run: python scripts/check_rules.py
      - name: Tests + coverage
        run: python -m pytest --cov=agent --cov-report=term --cov-report=xml --junitxml=pytest.xml
      - name: Test summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse("pytest.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          t, f, e = int(s.get("tests")), int(s.get("failures")), int(s.get("errors"))
          cov = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"### Tests: {t - f - e}/{t} passed · coverage {cov:.0f}%")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            pytest.xml
            coverage.xml

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency vulnerabilities (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Static security analysis (ruff bandit rules)
        run: |
          pip install ruff
          ruff check agent --select S --output-format=github

  release-gate:
    name: Release gate (all rules verified)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml && python scripts/check_rules.py --strict
