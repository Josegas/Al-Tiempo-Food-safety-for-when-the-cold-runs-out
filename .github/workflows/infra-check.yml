name: Infra check

# On every PR that touches infrastructure: build the agent package and synthesize the
# CloudFormation templates (catches IaC errors before merge; needs no AWS credentials).
on:
  pull_request:
    paths:
      - "infra/**"
      - "agent/**"
      - "main.py"
      - "requirements.txt"
      - "scripts/package_agent.py"

permissions:
  contents: read

jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt -r infra/requirements.txt
      - run: python scripts/package_agent.py
      - name: cdk synth
        working-directory: infra
        env:
          CDK_DISABLE_CLI_TELEMETRY: "true"
          CDK_DEFAULT_REGION: us-east-1
        run: npx -y aws-cdk@2.1147.0 synth AlTiempoApp --quiet
