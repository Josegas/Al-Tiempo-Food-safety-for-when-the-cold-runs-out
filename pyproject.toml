[project]
name = "al-tiempo"
version = "0.1.0"
description = "Food-safety agent for households and shelters without reliable refrigeration (Strands Agents SDK)."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "strands-agents>=1.63",
  "bedrock-agentcore>=1.25",
  "boto3>=1.40",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.15"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]  # assert ok in tests; long strings wrapped by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
